# Publish to PyPI on every GitHub release, over OIDC ("trusted publishing"), so no API token is
# ever created, stored in a secret, or pasted anywhere.
#
# DONE on pypi.org, 2026-09-10, by the account holder:
#        PyPI Project Name : ectype-cli      <- `ectype` itself is admin-prohibited on PyPI
#        Owner             : chaybits
#        Repository name   : ectype
#        Workflow name     : publish-pypi.yml
#        Environment name  : (Any)
# So `pyproject.toml` sets name = "ectype-cli". Only the DISTRIBUTION name changed: the import
# package is still `ectype`, the command is still `ectype`, and `pip install ectype-cli` gives you
# both. Cutting a release runs the job below; nothing else to do.
#
# Hardening for later: create a GitHub environment named `pypi` with a required reviewer, add
# `environment: pypi` to the job, and narrow the publisher form's "Environment name" from (Any) to
# `pypi`. That makes an upload wait for a human click instead of firing on any release.
name: publish

on:
  release:
    types: [published]

# Nothing at the workflow level: each job declares the least it needs (a compromised action must
# not be able to push commits, cut releases or edit workflows with the default read-write token).
permissions: {}

jobs:
  pypi:
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # the OIDC token trusted publishing exchanges for an upload
      contents: read           # to check the source out
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check the metadata renders
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      # skip-existing keeps a re-cut release from failing on a version PyPI already has, which
      # is exactly what happens when a release is recreated.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  # A single file anyone can run with nothing installed but Python: `python ectype.pyz gui`.
  # Possible only because the package has no dependencies. Built by hand with the same three
  # lines; `_html_bytes()` reads the UI through importlib.resources so it works inside the zip.
  zipapp:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to attach the file to the release
      id-token: write          # to sign the provenance attestation (Sigstore, through GitHub)
      attestations: write      # to store the attestation with the repository
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build ectype.pyz
        run: |
          mkdir -p build/src && cp -r ectype build/src/
          find build/src -name '__pycache__' -type d -exec rm -rf {} +
          python -m zipapp build/src -o ectype.pyz -p "/usr/bin/env python3" -m "ectype.cli:main" -c
      - name: Prove it runs
        run: |
          python ectype.pyz --help > /dev/null
          python ectype.pyz agents > /dev/null
      # Build provenance: a signed statement that THIS file came out of THIS workflow run at THIS
      # commit, which anyone checks with `gh attestation verify ectype.pyz --owner chaybits`. The
      # checksum beside the file proves an intact download; this proves who built it.
      - name: Attest its provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ectype.pyz
      - name: Attach it to the release, with its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum ectype.pyz > ectype.pyz.sha256
          gh release upload "${{ github.event.release.tag_name }}" ectype.pyz ectype.pyz.sha256 --clobber

  # The Windows portable bundle: the official embeddable CPython with the package beside it and
  # two .bat launchers, for anyone who has neither Python nor a terminal. Same idea ComfyUI ships
  # as its Windows release, and affordable here only because there are no dependencies to resolve.
  #
  # Built on Linux, because the embeddable distribution is a zip of prebuilt files and needs no
  # Windows to unpack. It is then RUN on a real Windows runner before it may touch the release,
  # which is also the only place this project meets real Windows rather than wine.
  portable:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # it builds and uploads an artifact; the release is touched by the job after it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build the bundle
        run: bash packaging/windows/build-portable.sh --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable
          path: dist/*.zip
          if-no-files-found: error

  portable-windows:
    needs: portable
    runs-on: windows-latest
    permissions:
      contents: write          # to attach the file to the release
      id-token: write          # to sign the provenance attestation (Sigstore, through GitHub)
      attestations: write      # to store the attestation with the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portable
      - name: Unzip it the way a user would
        shell: pwsh
        run: Expand-Archive -Path (Get-ChildItem *.zip)[0].FullName -DestinationPath unpacked

      - name: Run it on real Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b = (Get-ChildItem unpacked -Directory)[0].FullName
          Write-Host "bundle: $b"

          # 1. the launcher runs at all, and reports the version the package carries
          $v = & cmd /c "`"$b\ectype.bat`" --version"
          if ($LASTEXITCODE -ne 0) { throw "ectype.bat --version exited $LASTEXITCODE" }
          Write-Host "version: $v"

          # 2. store discovery works: every adapter loads, sqlite3 included
          & cmd /c "`"$b\ectype.bat`" agents" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "ectype.bat agents exited $LASTEXITCODE" }

          # 3. the bundle is portable: settings resolve inside the folder, not into %APPDATA%.
          #    This fails loudly if the launcher's ECTYPE_CONFIG line is ever dropped or broken.
          $p = (& cmd /c "`"$b\ectype.bat`" settings --path" | Select-Object -Last 1).Trim()
          Write-Host "settings path: $p"
          if (-not $p.StartsWith($b)) { throw "settings resolved outside the bundle: $p" }

          # 4. the web UI actually serves its packaged page
          $proc = Start-Process cmd -PassThru -ArgumentList "/c","`"$b\ectype-gui.bat`" --port 8765 --no-open"
          $ok = $false
          foreach ($i in 1..30) {
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 3
              if ($r.StatusCode -eq 200 -and $r.Content -match "AI Agent Ectype") { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          taskkill /T /F /PID $proc.Id 2>&1 | Out-Null
          if (-not $ok) { throw "the web UI never answered on 127.0.0.1:8765" }
          Write-Host "web UI served its page"

      # Build provenance for the zip as well (see the zipapp job): the subject is the artifact as
      # downloaded, byte for byte what the upload below attaches.
      - name: Attest its provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.zip'
      - name: Attach it to the release, with its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $z = (Get-ChildItem *.zip)[0].FullName
          # the same "hash  name" line sha256sum prints, so `sha256sum -c` checks it on any platform
          $h = (Get-FileHash $z -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $z -Leaf)
          Set-Content -Path "$z.sha256" -Value $h -NoNewline
          gh release upload "${{ github.event.release.tag_name }}" $z "$z.sha256" --clobber
